<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Countdown</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #countdown {
            font-size: 10vw;
            font-weight: bold;
        }

        .label {
            font-size: 2vw;
            margin-top: 10px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<div>
    <div id="countdown">Loading...</div>
    <div class="label">DAYS : HOURS : MINUTES : SECONDS</div>
</div>

<script>
    // CHANGE THIS DATE
    const targetDate = new Date("2026-13-31T12:00:00");

    function updateCountdown() {
        const now = new Date();
        const difference = targetDate - now;

        if (difference <= 0) {
            document.getElementById("countdown").innerHTML = "00 : 00 : 00 : 00";
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((difference / (1000 * 60)) % 60);
        const seconds = Math.floor((difference / 1000) % 60);

        document.getElementById("countdown").innerHTML =
            `${days} : ${String(hours).padStart(2, "0")} : ${String(minutes).padStart(2, "0")} : ${String(seconds).padStart(2, "0")}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
